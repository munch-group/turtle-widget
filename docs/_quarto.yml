project:
  type: website
  output-dir: _build
  # resources:
  #   - objects.txt
  #   - objects-test.txt

execute:
  freeze: auto
  echo: true

metadata-files:
  - api/_sidebar.yml

filters:
  - "interlinks"

interlinks:
  fast: true
  sources:
    python:
      url: https://docs.python.org/3/
    griffe:
      url: https://mkdocstrings.github.io/griffe/
    numpy:
      url: https://numpy.org/doc/stable/
    pandas:
      url: https://pandas.pydata.org/docs/
    matplotlib:
      url: https://matplotlib.org/stable/
    scipy:
      url: https://docs.scipy.org/doc/scipy/
    statsmodels:
      url: https://www.statsmodels.org/stable/
    # quartodoc-test:
    #   url: https://machow.github.io/quartodoc
    #   inv: objects-test.txt

website:
  title: "turtle-widget"
  page-navigation: true
  navbar:
    left:
      - href: api/
        text: API reference
      # - href: gallery/
      #   text: Gallery
    right:
      - icon: github
        href: https://github.com/munch-group/turtle-widget/
  sidebar:
    - id: pages
      title: Get Started
      style: floating
      align: left
      contents:
        - pages/overview.ipynb
        - section: "Examples"
          contents:
            - pages/demo.ipynb                   

lightbox: true

format:
  html:
    theme: cosmo
    css:
      - api/_styles-quartodoc.css
      - styles.css
      # - custom.scss
    toc: true
    # code-block-background: false
    # code-block-border-left: true    
    # highlight-style: arrow
    mermaid:
      theme: neutral 

quartodoc:
  package: turtle_widget
  style: pkgdown
  dir: api
  render_interlinks: true
  options:
    signature_name: full
  renderer:
    style: markdown
    table_style: description-list
  sidebar: "api/_sidebar.yml"
  css: "api/_styles-quartodoc.css"

  sections:
    - title: Widget
      desc: |
        The animated turtle-graphics drawing widget.
      contents:
        - name: Turtle
          # Explicit allowlist, not `include_inherited: true`: Turtle's public API now
          # includes `show` (inherited from the internal Canvas base -- see CLAUDE.md
          # "Canvas vs Turtle"), but a blanket include_inherited would also pull in
          # dozens of unrelated public methods from anywidget/ipywidgets/traitlets
          # (close, open, observe, hold_trait_notifications, ...). Add any new public
          # method here (alongside its numpy-style docstring) so it doesn't silently
          # drop out of the reference the way `show` did when it moved to Canvas.
          members:
            - add_circle
            - add_polygon
            - add_rectangle
            - add_segment
            - backward
            - begin_fill
            - bgcolor
            - circle
            - clear
            - color
            - distance_ahead
            - dot
            - duration
            - end_fill
            - fillcolor
            - forward
            - goto
            - heading
            - hide_obstacles
            - hideturtle
            - home
            - isdown
            - isvisible
            - left
            - nearest
            - new_turtle
            - on_collision
            - other_turtle
            - pencolor
            - pendown
            - pensize
            - penup
            - position
            - reset
            - right
            - sense
            - setheading
            - sethome
            - setx
            - sety
            - show
            - show_obstacles
            - showturtle
            - speed
            - stamp
            - write
            - xcor
            - ycor
